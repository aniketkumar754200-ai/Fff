<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#080D1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aniket AI" />
    <link
      rel="icon"
      type="image/jpeg"
      href="/src/assets/images/aniket_ai_logo_3d_1794834195022.jpg"
    />
    <link
      rel="apple-touch-icon"
      href="/src/assets/images/aniket_ai_logo_3d_1794834195022.jpg"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Aniket AI</title>
    <meta
      name="description"
      content="A personal AI assistant supporting English, Hindi, and Hinglish with voice input, local chat history, and clear step-by-step explanations."
    />
    <meta property="og:title" content="Aniket AI" />
    <meta
      property="og:description"
      content="A personal AI assistant supporting English, Hindi, and Hinglish with voice input, local chat history, and clear step-by-step explanations."
    />
    <meta
      property="og:image"
      content="/src/assets/images/aniket_ai_logo_3d_1794834195022.jpg"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aniket-ai-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#080D1A] dark:text-slate-100 antialiased selection:bg-violet-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
